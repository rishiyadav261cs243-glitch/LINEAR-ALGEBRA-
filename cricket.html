<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Super Over Cricket</title>
<style>
:root{--bg:#e9efe4;--fg:#14301a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1710;--fg:#e4f1e1}}
:root[data-theme="dark"]{--bg:#0d1710;--fg:#e4f1e1}
html,body{height:100%;margin:0;background:var(--bg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
#bk{position:fixed;top:env(safe-area-inset-top,0px);left:0;z-index:4;padding:8px 14px;font:600 15px system-ui,sans-serif;color:var(--fg);text-decoration:none}
body{padding-top:34px;box-sizing:border-box;display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
canvas{display:block;border-radius:14px;touch-action:none}
#nm{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:var(--bg);color:var(--fg);padding:24px}
#nm h1{margin:0;font-size:30px}#nm p{margin:0 0 6px;opacity:.8}
#nm input{width:min(260px,80vw);padding:13px 14px;font-size:16px;border:2px solid #2d7a3a;border-radius:10px;background:transparent;color:var(--fg);-webkit-user-select:text;user-select:text}
#nm button{width:min(260px,80vw);padding:14px;font-size:17px;font-weight:700;border:0;border-radius:10px;background:#2d7a3a;color:#fff;margin-top:6px}
#nm button:focus-visible,#nm input:focus-visible{outline:3px solid #e8b923}
</style></head><body>
<a id="bk" href="index.html">‹ Back to notes</a>
<canvas id="c" aria-label="Cricket batting game. Tap when the ball reaches the bat."></canvas>
<div id="nm"><h1>Super Over Cricket</h1><p>Name your two opening batters</p>
<input id="n1" maxlength="10" placeholder="Batter 1" autocomplete="off"><input id="n2" maxlength="10" placeholder="Batter 2" autocomplete="off"><button id="go">Start innings</button></div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d'),W=360,H=600,TOT=18;
c.width=W*2;c.height=H*2;x.scale(2,2);
function fit(){const s=Math.min(document.body.clientWidth/W,(document.body.clientHeight-34)/H);c.style.width=W*s+'px';c.style.height=H*s+'px'}
addEventListener('resize',fit);fit();
const lerp=(a,b,t)=>a+(b-a)*t,cl=t=>Math.max(0,Math.min(1,t));
const NM=['Batter 1','Batter 2'];let S;
function reset(){S={runs:0,w:0,b:0,target:30+Math.floor(Math.random()*9),ph:'idle',rt:0,msg:'3 overs, 3 wickets',sub:'Tap to bowl the first ball|Tap as the ball reaches the bat',ball:null,swing:null,fly:null,bowled:false,end:null,hist:[],sig:'',pl:NM.map(n=>({n,r:0,b:0,o:false})),cur:[0,1],st:0}}
reset();
document.getElementById('go').onclick=()=>{NM[0]=document.getElementById('n1').value.trim()||'Batter 1';NM[1]=document.getElementById('n2').value.trim()||'Batter 2';document.getElementById('nm').style.display='none';reset()};
const F=[[132,548],[70,470],[62,350],[130,215],[240,210],[305,330],[310,450]];
function bowl(){const n=performance.now();S.ph='bowl';S.swing=null;S.fly=null;S.bowled=false;S.sig='';S.msg='';S.sub='';
 S.ball={s:n,t0:n+900,T:950+Math.random()*550,line:(Math.random()-.5)*.8,sw:(Math.random()-.5)*.25,pb:.58+Math.random()*.17}}
function resolve(now){
 const b=S.ball,sw=S.swing,pl=S.pl[S.cur[S.st]];let r=0,out=false,msg='',sub='';
 const st=Math.abs(b.line)<.075;
 if(!sw){if(st){out=true;msg='BOWLED!';S.bowled=true}else{msg='Dot ball';sub='Left alone'}}
 else{const d=sw.d,a=Math.abs(d);sub=a<60?'Perfect timing':d<0?'Too early':'Too late';
  if(a<30){r=6;msg='SIX!'}
  else if(a<60){r=4;msg='FOUR!'}
  else if(a<110){r=Math.random()<.4?4:2;msg=r==4?'FOUR!':'2 runs'}
  else if(a<170){if(Math.random()<.15){out=true;msg='CAUGHT!'}else{r=Math.random()<.6?1:2;msg=r+(r>1?' runs':' run')}}
  else if(a<250){if(Math.random()<.35){out=true;msg='CAUGHT behind!'}else{r=Math.random()<.5?1:0;msg=r?'Edged for 1':'Dot ball'}}
  else{if(st){out=true;msg='BOWLED!';S.bowled=true}else{msg='Swing and a miss'}}}
 S.runs+=r;pl.r+=r;pl.b++;S.b++;S.hist.push(out?'W':r);
 if(out){pl.o=true;S.w++;if(S.w<3){S.pl.push({n:'Player '+(S.pl.length+1),r:0,b:0,o:false});S.cur[S.st]=S.pl.length-1}}
 if(r==1)S.st^=1;if(S.b%6===0)S.st^=1;
 S.sig=out?'out':r==6?'six':r==4?'four':'';
 S.msg=msg;S.sub=sub;S.rt=now;S.ph='result';
 if(r>0){const aim=(sw.fx-.5)*2,tx=180+aim*(r>=4?200:110),ty=r>=4?35:r==2?190:260;let bi=0,bd=1e9;F.forEach((f,i)=>{const d=Math.hypot(f[0]-tx,f[1]-ty);if(d<bd){bd=d;bi=i}});S.fly={s:now,six:r==6,four:r==4,tx,ty,bi}}
 if(S.runs>=S.target)S.end='win';else if(S.w>=3||S.b>=TOT)S.end='lose';
}
c.addEventListener('pointerdown',e=>{e.preventDefault();const rc=c.getBoundingClientRect(),fx=(e.clientX-rc.left)/rc.width,now=performance.now();
 if(S.ph==='idle'){bowl();return}
 if(S.ph==='over'&&now-S.rt>500){reset();bowl();return}
 if(S.ph==='bowl'&&!S.swing&&now>S.ball.t0-250)S.swing={at:now,d:now-(S.ball.t0+S.ball.T),fx}});
const gy=p=>lerp(125,480,p);
function bpos(p){const b=S.ball;let h;
 if(p<b.pb)h=70*(1-p/b.pb);else{const q=Math.min(1.2,(p-b.pb)/(1-b.pb));h=22*q+25*Math.sin(Math.PI*Math.min(q,1))}
 return{x:180+b.line*170*p+b.sw*Math.sin(Math.PI*Math.min(p,1))*60,y:gy(p)-h*(.4+.9*p),g:gy(p),r:2.5+7*p}}
function ball(px,py,r){x.fillStyle='#c62828';x.beginPath();x.arc(px,py,r,0,7);x.fill();x.strokeStyle='rgba(255,255,255,.7)';x.lineWidth=1;x.beginPath();x.arc(px,py,r*.65,.5,2.4);x.stroke()}
function P(px,py,s,sh,pa,hat,fn){x.save();x.translate(px,py);x.scale(s,s);
 x.fillStyle=pa;x.fillRect(-5,0,4,14);x.fillRect(1,0,4,14);x.fillStyle=sh;x.fillRect(-5,-22,10,22);
 x.fillStyle='#f0c9a0';x.beginPath();x.arc(0,-29,6,0,7);x.fill();x.fillStyle=hat;x.beginPath();x.arc(0,-31,6.5,Math.PI,0);x.fill();
 if(fn)fn();x.restore()}
function arm(x1,y1,x2,y2,col){x.strokeStyle=col;x.lineWidth=4;x.lineCap='round';x.beginPath();x.moveTo(x1,y1);x.lineTo(x2,y2);x.stroke()}
function stumps(px,py,down){x.strokeStyle='#f4e9c8';x.lineWidth=3;for(let i=-1;i<=1;i++){x.beginPath();if(down){x.moveTo(px+i*10,py+22);x.lineTo(px+i*10+i*14,py+8+Math.abs(i)*6)}else{x.moveTo(px+i*10,py+22);x.lineTo(px+i*10,py)}x.stroke()}}
function txt(t,px,py,size,col,al){x.font='800 '+size+'px system-ui,-apple-system,sans-serif';x.textAlign=al||'center';x.lineWidth=5;x.strokeStyle='rgba(0,0,0,.55)';x.strokeText(t,px,py);x.fillStyle=col;x.fillText(t,px,py)}
const YL='#f2c230';
function draw(now){
 const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#2d7a3a');g.addColorStop(1,'#3d9645');x.fillStyle=g;x.fillRect(0,0,W,H);
 for(let i=0;i<8;i++){x.fillStyle=i%2?'rgba(255,255,255,.05)':'rgba(0,0,0,.05)';x.fillRect(0,i*75,W,75)}
 x.strokeStyle='rgba(255,255,255,.75)';x.lineWidth=3;x.beginPath();x.ellipse(180,310,172,285,0,0,7);x.stroke();
 x.fillStyle='#d8bd84';x.beginPath();x.moveTo(155,115);x.lineTo(205,115);x.lineTo(268,520);x.lineTo(92,520);x.fill();
 x.strokeStyle='#fff';x.lineWidth=2;x.beginPath();x.moveTo(100,492);x.lineTo(260,492);x.moveTo(160,125);x.lineTo(200,125);x.stroke();
 const b=S.ball,fl=S.fly,fp=fl?cl((now-fl.s)/900):0;let bp=null;
 if(fl){bp=[lerp(200,fl.tx,fp),lerp(465,fl.ty,fp)-Math.sin(fp*Math.PI)*(fl.six?110:fl.four?12:20)]}
 F.forEach((f,i)=>{let fx=f[0],fy=f[1];if(fl&&fl.bi===i){const k=cl(fp*1.3)*(fl.four||fl.six?.7:.85);fx=lerp(fx,bp[0],k);fy=lerp(fy,bp[1],k)}P(fx,fy,.5+fy/600*.35,YL,'#fff','#1d6f73')});
 P(214,104,.72,'#f5f5f5','#333','#222',()=>{if(S.sig==='six'){arm(-5,-20,-9,-44,'#f5f5f5');arm(5,-20,9,-44,'#f5f5f5')}else if(S.sig==='four')arm(5,-20,24,-24+Math.sin(now/60)*5,'#f5f5f5');else if(S.sig==='out')arm(5,-20,6,-46,'#f5f5f5')});
 P(148,128,.72,'#2a6fdb','#1b2a6b','#1b2a6b');
 stumps(180,128,false);
 const bk=b?cl((now-b.s)/(b.t0-b.s)):(S.ph==='idle'?1:0);
 P(180,lerp(70,114,bk),lerp(.7,.88,bk),YL,'#fff','#1d6f73',()=>{const kk=b?cl((now-(b.t0-260))/260):1;x.save();x.translate(5,-20);x.rotate(lerp(-2.6,.2,kk));arm(0,0,0,-16,'#f0c9a0');x.restore()});
 stumps(180,472,S.bowled&&S.ph!=='bowl');
 if(b&&(S.ph==='bowl'||(S.ph==='result'&&!fl))){const p=(now-b.t0)/b.T;
  if(p>0&&p<1.25){const q=bpos(p);x.fillStyle='rgba(0,0,0,.25)';x.beginPath();x.ellipse(q.x,q.g,q.r,q.r*.4,0,0,7);x.fill();
   if(!(S.bowled&&p>1))ball(q.x,q.y,q.r);
   if(S.ph==='bowl'&&p>.35&&p<1.02&&!S.swing){x.strokeStyle='rgba(255,255,255,.65)';x.lineWidth=2;x.beginPath();x.arc(180+b.line*170,452,14+(1-p)*45,0,7);x.stroke()}}}
 if(fl)ball(bp[0],bp[1],Math.max(2.5,8-fp*(fl.six?4:3)));
 const ang=S.swing?lerp(-2.2,.7,cl((now-S.swing.at)/160)):-2.2;
 P(222,505,1.1,'#2a6fdb','#1b2a6b','#1b2a6b',()=>{x.save();x.translate(-4,-12);x.rotate(ang);x.strokeStyle='#e3b873';x.lineCap='round';x.lineWidth=6;x.beginPath();x.moveTo(0,0);x.lineTo(0,34);x.stroke();x.restore()});
 P(180,548,1.2,YL,'#fff','#1d6f73',()=>{x.fillStyle=YL;x.beginPath();x.arc(-9,-8,3.5,0,7);x.arc(9,-8,3.5,0,7);x.fill()});
 x.fillStyle='rgba(0,0,0,.55)';x.fillRect(0,0,W,76);
 x.textAlign='left';x.fillStyle='#fff';x.font='800 28px system-ui,sans-serif';x.fillText(S.runs+'/'+S.w,12,36);
 x.textAlign='right';x.font='700 14px system-ui,sans-serif';x.fillText('Overs '+Math.floor(S.b/6)+'.'+S.b%6+' / 3',W-12,22);
 x.fillStyle='rgba(255,255,255,.8)';x.font='600 13px system-ui,sans-serif';x.fillText('Need '+Math.max(0,S.target-S.runs)+' from '+(TOT-S.b)+' balls',W-12,40);
 S.cur.forEach((pi,i)=>{const p=S.pl[pi],t=p.n+(S.st===i?'*':'')+'  '+p.r+' ('+p.b+')';x.font=(S.st===i?'800':'600')+' 13px system-ui,sans-serif';x.fillStyle=S.st===i?'#ffd54f':'#fff';x.textAlign=i?'right':'left';x.fillText(t,i?W-12:12,64)});
 const n=(S.ph==='bowl'||S.ph==='idle')?S.b:S.b-1,oi=Math.floor(Math.max(0,n)/6);
 x.textAlign='left';x.fillStyle='#fff';x.font='700 12px system-ui,sans-serif';x.fillText('Over '+(oi+1),12,582);
 for(let i=0;i<6;i++){const h=S.hist[oi*6+i],cx=84+i*42;x.fillStyle=h===undefined?'rgba(255,255,255,.2)':h==='W'?'#d32f2f':h>=4?'#e8b923':'rgba(255,255,255,.88)';x.beginPath();x.arc(cx,578,13,0,7);x.fill();
  if(h!==undefined){x.fillStyle=h==='W'?'#fff':'#222';x.font='700 13px system-ui,sans-serif';x.textAlign='center';x.fillText(h,cx,583)}}
 if(S.ph==='over'){x.fillStyle='rgba(0,0,0,.65)';x.fillRect(0,76,W,H-76)}
 if(S.msg){const col=/SIX|FOUR|WON/.test(S.msg)?'#ffd54f':/BOWLED|CAUGHT|OVER/.test(S.msg)?'#ff8a80':'#fff';txt(S.msg,180,250,S.msg.length>12?30:44,col)}
 S.sub.split('|').forEach((l,i)=>{if(l)txt(l,180,285+i*24,16,'#fff')})
}
function tick(now){
 if(S.ph==='bowl'){const b=S.ball,arr=b.t0+b.T;if(S.swing?now>=Math.max(arr,S.swing.at):now>=arr+110)resolve(now)}
 else if(S.ph==='result'&&now-S.rt>(S.fly?1500:1300)){
  if(S.end){S.ph='over';S.rt=now;S.fly=null;S.sig='';
   const sc=S.pl.map(p=>p.n+'  '+p.r+' ('+p.b+')'+(p.o?' out':'')).join('|');
   if(S.end==='win'){S.msg='YOU WON!';S.sub='Chased '+S.target+' in '+Math.floor(S.b/6)+'.'+S.b%6+' overs|'+sc+'|Tap to play again'}
   else{S.msg='GAME OVER';S.sub='Fell '+(S.target-S.runs)+' short of '+S.target+'|'+sc+'|Tap to play again'}}
  else bowl()}
 draw(now);requestAnimationFrame(tick)}
requestAnimationFrame(tick);
</script></body></html>

async function readFile(f){
 const ext=(f.name.split(".").pop()||"").toLowerCase();
 if(ext=="docx"){if(typeof mammoth=="undefined")throw new Error("The Word reader did not load. Check your internet and try again.");

  const pdf=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;let out="";
  for(let p=1;p<=pdf.numPages;p++){const c=await(await pdf.getPage(p)).getTextContent(),rows={};
   c.items.forEach(it=>{const y=Math.round(it.transform[5]/3);(rows[y]=rows[y]||[]).push(it)});

  if(!out.trim())throw new Error("No text found. Scanned (image-only) PDFs are not supported.");return out}
 if(ext=="doc")throw new Error("Old .doc files are not supported. In Word, choose Save as .docx and upload that.");
 return await f.text()}
function csvSplit(l){const o=[];let c="",q=false;for(let i=0;i<l.length;i++){const ch=l[i];

const isOpt=l=>/^\(?[A-Da-d][\).:]\s*\S/.test(l),isNum=l=>/^(?:q(?:uestion)?\s*)?\d+\s*[\).:\-]\s*\S/i.test(l);
function parseQ(t){

 const pipes=lines.filter(l=>(l.match(/\|/g)||[]).length>=5).length;

function parseLines(lines){const qs=[];let bad=0;
 lines.forEach((l,i)=>{const p=l.indexOf("|")>=0?l.split("|").map(x=>x.trim()):csvSplit(l);

 return{qs,bad}}
function parseBlocks(lines){const qs=[];let bad=0,cur=null;
 const push=()=>{if(!cur)return;if(cur.q&&cur.o.length==4&&Array.from(cur.o).every(Boolean)&&cur.a>=0)qs.push({q:cur.q,o:Array.from(cur.o),a:cur.a});else bad++;cur=null};
 lines.forEach(l=>{let m;
  if(cur&&(m=l.match(/^(?:answer|ans|correct(?: answer| option)?)\s*[:=.\-]?\s*\(?([A-Da-d1-4])\)?(?![A-Za-z])/i))){const v=m[1].toUpperCase();cur.a=/\d/.test(v)?+v-1:L.indexOf(v);return}
  if(cur&&(m=l.match(/^\(?([A-Da-d])[\).:]\s*(.+)$/))){const k=L.indexOf(m[1].toUpperCase());cur.o[k]=m[2].trim();cur.last=k;return}
  if(cur&&(cur.a>=0||(isNum(l)&&cur.o.length>=4)))push();

  if(mine)app.innerHTML=`<div class="top"><span>Question ${qi+1} of ${R.qs.length}</span><span class="tm" id="tm">${R.limit}</span></div><div class="card c"><h2>Answer locked in</h2><p class="sub">You picked ${L[mine.c]}. Waiting for the others…</p></div>`;
  else{app.innerHTML=qhead()+`<div class="grid">${q.o.map((o,i)=>`<button class="o o${i}" data-k="${i}">${L[i]}. ${esc(o)}</button>`).join("")}</div>`;
   app.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>answer(+b.dataset.k))}}
 else if(R.state=="reveal")app.innerHTML=`<p class="sub">Question ${qi+1} of ${R.qs.length}</p><div class="res ${me.ok?"ok":"bad"}">${me.ok?"Correct":me.pick<0?"Out of time":"Wrong"}</div>
  <div class="card c"><p class="sub">Correct answer</p><b>${L[q.a]}. ${esc(q.o[q.a])}</b></div>
  <div class="card c"><p class="sub">You scored</p><div class="tm">+${me.last||0}</div><p>Total ${me.score||0} · Rank ${rank} of ${P.length}</p></div><p class="sub c">Waiting for the next question…</p>`;
 else app.innerHTML=`<h1 class="c">Game over</h1><div class="card c"><p class="sub">Your final rank</p><div class="big" style="letter-spacing:0">${rank}</div><p>of ${P.length} players · ${me.score||0} points</p></div><h3>Top players</h3>${lb(P,5)}<button class="btn" id="hm">Back to start</button>`;
 const h=$("hm");if(h)h.onclick=home}
(function resume(){
 if(!OK){home();return}
 try{const s=JSON.parse(localStorage.getItem("lq")||"null");if(s&&s.c){
  db.ref("rooms/"+s.c).once("value").then(r=>{if(r.exists()&&r.val().players&&r.val().players[s.pid]){code=s.c;pid=s.pid;role="player";listen()}else home()}).catch(home);return}}catch(e){}
 home()})();

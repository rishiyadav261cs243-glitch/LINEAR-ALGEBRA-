<h1>Matrix Lab</h1>
<div id="tabs" role="tablist"></div>
<section id="p2"><canvas id="c2" aria-label="2 by 2 matrix transformation"></canvas>
<div class="pr" id="pr2"></div><div class="mg" id="g2"></div><div class="ro" id="r2"></div>
<p class="h">Drag the red and blue arrow tips. Each column of the matrix is where an arrow lands. The shaded square is the unit square after the transformation, and green dashed lines are eigenvectors.</p></section>
<section id="p3" hidden><canvas id="c3" aria-label="3 by 3 matrix transformation"></canvas>
<div class="pr" id="pr3"></div><div class="mg" id="g3"></div><div class="ro" id="r3"></div>
<p class="h">Drag the picture to rotate the view. The thin cube is the original, the bold cube is after the matrix. Red, green and blue arrows are where x, y and z land.</p></section>
<section id="ps" hidden><div class="pr"><button id="n2">2 variables</button><button id="n3">3 variables</button></div>
<div class="mg" id="gs" style="max-width:380px"></div>
<div class="pr"><button class="pri" id="sv">Solve step by step</button></div><div id="out"></div>
<p class="h">Type whole numbers, decimals or fractions like 1/2. Each row is one equation.</p></section>
<script>
const $=i=>document.getElementById(i),css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim(),r2=n=>+n.toFixed(2);
function mk(el,cols,vals,pre,cb,head){el.style.gridTemplateColumns='repeat('+cols+',1fr)';el.innerHTML='';
 if(head)head.forEach(h=>{const s=document.createElement('span');s.className='hd';s.textContent=h;el.appendChild(s)});
 vals.forEach((v,i)=>{const n=document.createElement('input');n.value=v;n.id=pre+i;n.autocomplete='off';n.setAttribute('aria-label','entry '+(i+1));if(cb)n.oninput=cb;el.appendChild(n)})}
const val=(p,k)=>{const v=parseFloat($(p+k).value);return isNaN(v)?0:v};
function pres(el,list,pre,fn){el.innerHTML='';list.forEach(([n,v])=>{const b=document.createElement('button');b.textContent=n;b.onclick=()=>{v.forEach((t,i)=>$(pre+i).value=t);fn()};el.appendChild(b)})}
function ln(x,p,q){x.beginPath();x.moveTo(p[0],p[1]);x.lineTo(q[0],q[1]);x.stroke()}
function arr(x,p,q,col){x.strokeStyle=col;x.fillStyle=col;x.lineWidth=3;x.setLineDash([]);ln(x,p,q);const t=Math.atan2(q[1]-p[1],q[0]-p[0]);x.beginPath();x.moveTo(q[0],q[1]);x.lineTo(q[0]-11*Math.cos(t-.4),q[1]-11*Math.sin(t-.4));x.lineTo(q[0]-11*Math.cos(t+.4),q[1]-11*Math.sin(t+.4));x.fill()}
function cv(id){const c=$(id);c.width=c.height=720;const x=c.getContext('2d');x.scale(2,2);return x}
const X2=cv('c2'),X3=cv('c3');
const pt=(e,c)=>{const k=c.getBoundingClientRect();return[(e.clientX-k.left)/k.width*360,(e.clientY-k.top)/k.height*360]};
/* ---------- 2x2 ---------- */
function draw2(){const x=X2,S=360,u=30,o=180,a=val('a',0),b=val('a',1),c=val('a',2),d=val('a',3),f=css('--fg'),ac=css('--ac');
 const Q=(p,q)=>[o+p*u,o-q*u],P=(p,q)=>Q(a*p+b*q,c*p+d*q);
 x.clearRect(0,0,S,S);x.setLineDash([]);
 x.strokeStyle=f;x.globalAlpha=.12;x.lineWidth=1;for(let k=-6;k<=6;k++){ln(x,Q(k,-6),Q(k,6));ln(x,Q(-6,k),Q(6,k))}
 x.globalAlpha=.4;x.lineWidth=1.5;ln(x,Q(-6,0),Q(6,0));ln(x,Q(0,-6),Q(0,6));
 x.strokeStyle=ac;x.globalAlpha=.5;x.lineWidth=1;for(let k=-6;k<=6;k++){ln(x,P(k,-6),P(k,6));ln(x,P(-6,k),P(6,k))}
 x.globalAlpha=.28;x.fillStyle=ac;x.beginPath();[[0,0],[1,0],[1,1],[0,1]].forEach(([p,q],i)=>{const z=P(p,q);i?x.lineTo(z[0],z[1]):x.moveTo(z[0],z[1])});x.fill();
 x.globalAlpha=1;
 const tr=a+d,det=a*d-b*c,dc=tr*tr/4-det;let ev;
 if(dc>=-1e-9){const s=Math.sqrt(Math.max(0,dc)),L=[tr/2+s,tr/2-s];ev='Eigenvalues: '+r2(L[0])+(s>1e-9?', '+r2(L[1]):'');
  x.setLineDash([6,5]);x.strokeStyle='#16a34a';x.lineWidth=2;
  (s>1e-9?L:[L[0]]).forEach(l=>{let v=Math.abs(b)>1e-9?[b,l-a]:Math.abs(c)>1e-9?[l-d,c]:Math.abs(l-a)<1e-9?[1,0]:[0,1];const m=Math.hypot(v[0],v[1])||1;v=[v[0]/m*9,v[1]/m*9];ln(x,Q(-v[0],-v[1]),Q(v[0],v[1]))});x.setLineDash([])}
 else ev='Eigenvalues: '+r2(tr/2)+' ± '+r2(Math.sqrt(-dc))+'i (rotation-type map, no real eigenvectors)';
 arr(x,Q(0,0),Q(a,c),'#ef4444');arr(x,Q(0,0),Q(b,d),'#3b82f6');
 [[a,c,'#ef4444'],[b,d,'#3b82f6']].forEach(([p,q,col])=>{x.strokeStyle=col;x.lineWidth=2;const z=Q(p,q);x.beginPath();x.arc(z[0],z[1],9,0,7);x.stroke()});
 $('r2').innerHTML='<b>det = '+r2(det)+'</b> · trace = '+r2(tr)+'<br>'+ev+'<br>'+(Math.abs(det)<1e-9?'Singular: the plane collapses onto a line or a point, so it cannot be undone.':'Areas scale by ×'+r2(Math.abs(det))+(det<0?' and the picture is flipped like a mirror.':'.'))}
let dg=null;const c2=$('c2');
c2.onpointerdown=e=>{const[p,q]=pt(e,c2),a=[val('a',0),val('a',2)],b=[val('a',1),val('a',3)],d1=Math.hypot(180+a[0]*30-p,180-a[1]*30-q),d2=Math.hypot(180+b[0]*30-p,180-b[1]*30-q);if(Math.min(d1,d2)<30){dg=d1<d2?0:1;c2.setPointerCapture(e.pointerId)}};
c2.onpointermove=e=>{if(dg===null)return;const[p,q]=pt(e,c2),cl=v=>Math.max(-5,Math.min(5,Math.round(v*20)/20));$('a'+(dg?1:0)).value=cl((p-180)/30);$('a'+(dg?3:2)).value=cl((180-q)/30);draw2()};
c2.onpointerup=c2.onpointercancel=()=>dg=null;
/* ---------- 3x3 ---------- */
let yaw=.7,pit=.45;
function rank(M){M=M.map(r=>r.slice());let r=0;for(let c=0;c<M[0].length&&r<M.length;c++){let p=r;for(let i=r;i<M.length;i++)if(Math.abs(M[i][c])>Math.abs(M[p][c]))p=i;if(Math.abs(M[p][c])<1e-9)continue;[M[r],M[p]]=[M[p],M[r]];for(let i=r+1;i<M.length;i++){const k=M[i][c]/M[r][c];for(let j=c;j<M[0].length;j++)M[i][j]-=k*M[r][j]}r++}return r}
function draw3(){const x=X3,o=180,u=46,m=[0,1,2,3,4,5,6,7,8].map(i=>val('m',i)),f=css('--fg'),ac=css('--ac');
 const T=p=>[0,1,2].map(i=>m[3*i]*p[0]+m[3*i+1]*p[1]+m[3*i+2]*p[2]);
 const cy=Math.cos(yaw),sy=Math.sin(yaw),cp=Math.cos(pit),sp=Math.sin(pit);
 const V=p=>{const a=p[0]*cy-p[1]*sy,b=p[0]*sy+p[1]*cy;return[o+a*u,o-(b*sp+p[2]*cp)*u]};
 x.clearRect(0,0,360,360);x.setLineDash([]);
 const vs=[0,1,2,3,4,5,6,7].map(i=>[i&1,i>>1&1,i>>2&1]);
 const cube=(mp,col,al,w)=>{x.strokeStyle=col;x.globalAlpha=al;x.lineWidth=w;vs.forEach((p,i)=>[1,2,4].forEach(bt=>{if(!(i&bt))ln(x,V(mp(p)),V(mp(vs[i|bt])))}))};
 cube(p=>p,f,.28,1);cube(T,ac,.95,2.2);
 [[[1,0,0],'#ef4444'],[[0,1,0],'#16a34a'],[[0,0,1],'#3b82f6']].forEach(([e,col])=>{x.globalAlpha=.3;x.strokeStyle=f;x.lineWidth=1;ln(x,V([0,0,0]),V(e.map(k=>k*2.5)));x.globalAlpha=1;arr(x,V([0,0,0]),V(T(e)),col)});
 x.globalAlpha=1;
 const det=m[0]*(m[4]*m[8]-m[5]*m[7])-m[1]*(m[3]*m[8]-m[5]*m[6])+m[2]*(m[3]*m[7]-m[4]*m[6]),rk=rank([[m[0],m[1],m[2]],[m[3],m[4],m[5]],[m[6],m[7],m[8]]]);
 $('r3').innerHTML='<b>det = '+r2(det)+'</b> · trace = '+r2(m[0]+m[4]+m[8])+' · rank = '+rk+'<br>'+(rk===3?'Volumes scale by ×'+r2(Math.abs(det))+(det<0?' and space is mirrored.':'.'):'Singular: space is squashed flat into '+(rk===2?'a plane':rk===1?'a line':'a single point')+', so it cannot be undone.')}
let rd=null;const c3=$('c3');
c3.onpointerdown=e=>{rd=[e.clientX,e.clientY];c3.setPointerCapture(e.pointerId)};
c3.onpointermove=e=>{if(!rd)return;yaw+=(e.clientX-rd[0])*.01;pit=Math.max(-1.5,Math.min(1.5,pit+(e.clientY-rd[1])*.01));rd=[e.clientX,e.clientY];draw3()};
c3.onpointerup=c3.onpointercancel=()=>rd=null;
/* ---------- solver (exact fractions) ---------- */
const g=(a,b)=>b?g(b,a%b):Math.abs(a),F=(n,d=1)=>{if(d<0){n=-n;d=-d}const k=g(n,d)||1;return{n:n/k,d:d/k}};
const add=(a,b)=>F(a.n*b.d+b.n*a.d,a.d*b.d),mul=(a,b)=>F(a.n*b.n,a.d*b.d),sub=(a,b)=>add(a,F(-b.n,b.d)),dv=(a,b)=>F(a.n*b.d,a.d*b.n),z0=a=>a.n===0,fs=a=>a.d===1?''+a.n:a.n+'/'+a.d;
function parse(s){s=s.trim();if(!s)return F(0);if(s.includes('/')){const[p,q]=s.split('/'),n=+p,d=+q;return(isNaN(n)||isNaN(d)||!d)?null:F(n,d)}if(isNaN(+s))return null;const k=(s.split('.')[1]||'').length;return F(Math.round(+s*Math.pow(10,k)),Math.pow(10,k))}
const SB=['₁','₂','₃'],VN=['x','y','z'];let nv=3;
function sgrid(){const ex=nv===3?['1','1','1','6','0','2','5','-4','2','5','-1','27']:['2','1','5','1','-1','1'];mk($('gs'),nv+1,ex,'s',null,VN.slice(0,nv).concat(['= b']));$('n2').className=nv===2?'on':'';$('n3').className=nv===3?'on':'';$('out').innerHTML=''}
const tbl=M=>'<table class="mx">'+M.map(r=>'<tr>'+r.map((v,j)=>'<td'+(j===nv?' class="sp"':'')+'>'+fs(v)+'</td>').join('')+'</tr>').join('')+'</table>';
function expr(rhs,terms){let s=z0(rhs)?'':fs(rhs);terms.forEach(([k,nm])=>{if(z0(k))return;const neg=k.n<0,ab=F(Math.abs(k.n),k.d),co=(ab.n===1&&ab.d===1)?'':fs(ab);s+=(neg?(s?' − ':'−'):(s?' + ':''))+co+nm});return s||'0'}
function solve(){const n=nv,M=[];for(let i=0;i<n;i++){M.push([]);for(let j=0;j<=n;j++){const v=parse($('s'+(i*(n+1)+j)).value);if(!v){$('out').innerHTML='<div class="st">Please check row '+(i+1)+': every box needs a number or a fraction like 1/2.</div>';return}M[i].push(v)}}
 const steps=[['Start with the augmented matrix',M.map(r=>r.slice())]];
 const snap=t=>steps.push([t,M.map(r=>r.slice())]);let r=0;const piv=[];
 for(let c=0;c<n&&r<n;c++){let p=-1;for(let i=r;i<n;i++)if(!z0(M[i][c])){p=i;break}
  if(p<0)continue;
  if(p!==r){[M[r],M[p]]=[M[p],M[r]];snap('Swap R'+SB[r]+' ↔ R'+SB[p]+' to get a nonzero pivot')}
  const pv=M[r][c];if(!(pv.n===1&&pv.d===1)){M[r]=M[r].map(v=>dv(v,pv));snap('R'+SB[r]+' → R'+SB[r]+' ÷ '+fs(pv)+' to make the pivot 1')}
  for(let i=0;i<n;i++)if(i!==r&&!z0(M[i][c])){const k=M[i][c];M[i]=M[i].map((v,j)=>sub(v,mul(k,M[r][j])));snap('R'+SB[i]+' → R'+SB[i]+' − ('+fs(k)+')·R'+SB[r]+' to clear column '+(c+1))}

 S.cur.forEach((pi,i)=>{const p=S.pl[pi],t=p.n+(S.st===i?'*':'')+'  '+p.r+' ('+p.b+')';x.font=(S.st===i?'800':'600')+' 13px system-ui,sans-serif';x.fillStyle=S.st===i?'#ffd54f':'#fff';x.textAlign=i?'right':'left';x.fillText(t,i?W-12:12,64)});

<script>
const CH=typeof P1!=="undefined"?P1:[];
const SEC=[
["1.1 Systems of linear equations","Matrix notation, the three possible outcomes",`
<p>A <b>linear equation</b> in variables x₁,…,xₙ has the form a₁x₁ + … + aₙxₙ = b. A <b>linear system</b> is a list of such equations in the same variables, and a <b>solution</b> satisfies all of them at once. Two systems are <b>equivalent</b> if they have the same solution set.</p>
<p>The <b>coefficient matrix</b> holds the aᵢⱼ. The <b>augmented matrix</b> adds the right-hand side as a last column.</p>
<pre>x₁ + 2x₂ = 5        [ 1  2 | 5 ]
3x₁ + 4x₂ = 6   →   [ 3  4 | 6 ]</pre>
<p><b>Theorem 1.</b> A linear system has no solution, exactly one solution, or infinitely many solutions.</p>
<details><summary>Proof</summary><p>Suppose the system has two different solutions u and v. For any real t put w = u + t(v − u). Take any equation a·x = b of the system. Then a·w = a·u + t(a·v − a·u) = b + t(b − b) = b. So every w satisfies every equation. Different values of t give different w because v ≠ u, so there are infinitely many solutions. ∎</p></details>
<div class="note"><b>Notable points.</b> “Consistent” means at least one solution exists. Geometrically, two lines in a plane are parallel (none), crossing (one) or equal (infinitely many). A system can never have exactly two solutions.</div>`],
["1.2 Row reduction and echelon forms","Row operations, pivots, free variables, consistency",`
<p>The <b>elementary row operations</b> are: (1) replace a row by itself plus a multiple of another row, (2) swap two rows, (3) scale a row by a nonzero number. Each is reversible, so <b>row-equivalent</b> augmented matrices give equivalent systems.</p>
<p>A matrix is in <b>echelon form</b> if zero rows are at the bottom, each leading entry (<b>pivot</b>) lies to the right of the pivot above it, and entries below each pivot are 0. It is in <b>reduced echelon form (RREF)</b> if also every pivot is 1 and is the only nonzero entry in its column.</p>
<h3>Row reduction algorithm</h3>
<p>Forward phase: take the leftmost nonzero column, bring a nonzero entry to the top by a swap, clear the entries below it, then repeat on the submatrix below. Backward phase: starting from the rightmost pivot, scale pivots to 1 and clear entries above them.</p>
<p><b>Theorem 2 (uniqueness).</b> Every matrix is row equivalent to exactly one RREF. (The positions of pivots therefore depend only on the matrix.)</p>
<p><b>Theorem 3 (existence).</b> A system is consistent if and only if the echelon form of its augmented matrix has no row of the form [0 … 0 | b] with b ≠ 0.</p>
<details><summary>Proof of Theorem 3</summary><p>Such a row says 0 = b with b ≠ 0, which no values satisfy, so the system is inconsistent. Conversely, if no such row exists, every nonzero row has a pivot in a coefficient column. Set all free variables to any values and solve for the basic variables from the bottom row upward. Each step is forced and consistent, so a solution exists. ∎</p></details>
<div class="note"><b>Notable points.</b> Basic variables sit in pivot columns, free variables in the others. Consistent with a free variable gives infinitely many solutions; consistent with none gives exactly one. The last column of the augmented matrix can never be a pivot column in a consistent system.</div>`],
["1.3 Vector equations and span","Linear combinations, geometry of span",`
<p>Vectors in ℝⁿ are columns of n real numbers. A <b>linear combination</b> of v₁,…,v<sub>p</sub> is c₁v₁ + … + c<sub>p</sub>v<sub>p</sub>. The <b>span</b> of the set is the set of all such combinations.</p>
<p><b>Theorem 4.</b> The vector equation x₁a₁ + … + xₙaₙ = b has the same solution set as the linear system whose augmented matrix is [a₁ … aₙ b].</p>
<details><summary>Proof</summary><p>Entry i of x₁a₁ + … + xₙaₙ is aᵢ₁x₁ + … + aᵢₙxₙ (writing aⱼ = (a₁ⱼ,…,a<sub>mj</sub>)). Setting it equal to bᵢ for every i is exactly the system with that augmented matrix. ∎</p></details>
<div class="note"><b>Notable points.</b> b is in Span{a₁,…,aₙ} if and only if [a₁ … aₙ b] is consistent. Span{v} for v ≠ 0 is a line through the origin. The span of two vectors that are not multiples of each other in ℝ³ is a plane through the origin. 0 is always in a span.</div>`],
["1.4 The matrix equation Ax = b","Ax as a combination of columns, existence of solutions",`
<p>If A has columns a₁,…,aₙ and x is in ℝⁿ, then <b>Ax = x₁a₁ + … + xₙaₙ</b>. Hence Ax = b is the same as the vector equation and the same as the system [A b]. It satisfies A(u + v) = Au + Av and A(cu) = c(Au).</p>
<p><b>Theorem 5.</b> For an m×n matrix A, these are equivalent: (a) Ax = b has a solution for every b in ℝᵐ; (b) every b is a combination of the columns of A; (c) the columns span ℝᵐ; (d) A has a pivot in every row.</p>
<details><summary>Proof</summary><p>(a), (b), (c) are the same statement by the definition of Ax and of span. (d) ⇒ (a): if A has a pivot in every row, the echelon form of [A b] has no row [0 … 0 | nonzero], so by Theorem 3 the system is consistent for every b. (a) ⇒ (d): suppose some row of the echelon form U of A has no pivot, so it is a zero row. Choose a vector d with a nonzero last entry and apply the reversed row operations to [U d]. This gives [A b] for some b, whose echelon form has the row [0 … 0 | nonzero], so Ax = b is inconsistent, contradicting (a). ∎</p></details>
<div class="note"><b>Notable points.</b> The pivot test is about A alone, not [A b]. If A has more rows than columns, (d) is impossible, so the columns cannot span ℝᵐ.</div>`],
["1.5 Solution sets of linear systems","Homogeneous systems, parametric vector form",`
<p>A system Ax = 0 is <b>homogeneous</b>. It always has the <b>trivial solution</b> x = 0. It has a nontrivial solution exactly when there is a free variable.</p>
<p><b>Parametric vector form.</b> Example: x₁ − 2x₂ + 3x₃ = 4. Here x₂ = s and x₃ = t are free, so x₁ = 4 + 2s − 3t and</p>
<pre>x = (4,0,0) + s(2,1,0) + t(−3,0,1)</pre>
<p><b>Theorem 6.</b> If Ax = b is consistent with a particular solution p, its solution set is {p + v : Av = 0}.</p>
<details><summary>Proof</summary><p>If Av = 0 then A(p + v) = Ap + Av = b + 0 = b. Conversely, if Aw = b then A(w − p) = b − b = 0, so w = p + v with v = w − p satisfying Av = 0. ∎</p></details>
<div class="note"><b>Notable points.</b> The solution set of Ax = b is the solution set of Ax = 0 shifted by p. A homogeneous system with more unknowns than equations always has a nontrivial solution. The solution set of Ax = 0 is a span (a line, plane, etc. through the origin).</div>`],
["1.6 Linear independence","Definition, tests, dependence theorems",`
<p>Vectors v₁,…,v<sub>p</sub> are <b>linearly independent</b> if c₁v₁ + … + c<sub>p</sub>v<sub>p</sub> = 0 only for c₁ = … = c<sub>p</sub> = 0. Otherwise they are <b>dependent</b>.</p>
<p><b>Test.</b> Put the vectors as columns of A. They are independent exactly when Ax = 0 has only the trivial solution, that is, when every column of A is a pivot column.</p>
<p><b>Theorem 7.</b> For p ≥ 2, the set is dependent if and only if at least one vector is a combination of the others.</p>
<details><summary>Proof</summary><p>(⇒) If c₁v₁ + … + c<sub>p</sub>v<sub>p</sub> = 0 with some c<sub>j</sub> ≠ 0, then v<sub>j</sub> = −Σ<sub>i≠j</sub> (cᵢ/c<sub>j</sub>) vᵢ. (⇐) If v<sub>j</sub> = Σ<sub>i≠j</sub> cᵢvᵢ, then v<sub>j</sub> − Σ cᵢvᵢ = 0 is a relation whose coefficient on v<sub>j</sub> is 1 ≠ 0. ∎</p></details>
<p><b>Theorem 8.</b> If p &gt; n, any set of p vectors in ℝⁿ is dependent.</p>
<details><summary>Proof</summary><p>The matrix A = [v₁ … v<sub>p</sub>] is n×p and has at most n pivots, so at least p − n &gt; 0 columns are free. Thus Ax = 0 has a nontrivial solution. ∎</p></details>
<div class="note"><b>Notable points.</b> Any set containing 0 is dependent (1·0 = 0). Two vectors are dependent exactly when one is a multiple of the other. A single vector is independent exactly when it is nonzero.</div>`],
["1.7 Linear transformations","Definition, standard matrix, one-to-one and onto",`
<p>A map T: ℝⁿ → ℝᵐ is <b>linear</b> if T(u + v) = T(u) + T(v) and T(cu) = cT(u) for all u, v, c. Then T(0) = 0.</p>
<p><b>Theorem 9.</b> Every linear T: ℝⁿ → ℝᵐ equals T(x) = Ax for a unique m×n matrix A = [T(e₁) … T(eₙ)], called the <b>standard matrix</b>.</p>
<details><summary>Proof</summary><p>Write x = x₁e₁ + … + xₙeₙ. By linearity, T(x) = x₁T(e₁) + … + xₙT(eₙ) = Ax. Uniqueness holds because the columns of A must be T(e₁),…,T(eₙ). ∎</p></details>
<p>Example: rotation of the plane by 90° counterclockwise sends e₁ → (0,1) and e₂ → (−1,0), so A = [0 −1; 1 0].</p>
<div class="note"><b>Notable points.</b> T is <b>one-to-one</b> exactly when Ax = 0 has only the trivial solution (columns independent). T is <b>onto</b> ℝᵐ exactly when the columns of A span ℝᵐ (pivot in every row). A linear map ℝ² → ℝ³ can never be onto.</div>`]];

 `<button class="row" id="lq"><span class="dot"></span><span><span class="tt">Live quiz</span><small>Host or join a class quiz (needs internet)</small></span></button>`+
 `<button class="row" id="lb"><span class="dot"></span><span><span class="tt">Matrix lab</span><small>Transform 2×2 and 3×3 matrices, solve step by step</small></span></button>`+
 `<button class="row" id="ck"><span class="dot"></span><span><span class="tt">Cricket break</span><small>A quick batting game to relax</small></span></button>`+
 (CHS.length<7?`<p class="sub">Chapters ${CHS.length+1} to 7 are coming soon.</p>`:"");
 app.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>chap(CHS[+b.dataset.c]));
 document.getElementById("lq").onclick=()=>{location.href="quiz.html"};
 const openEmbed=id=>{const f=document.createElement("iframe");f.style.cssText="position:fixed;inset:0;width:100%;height:100%;border:0;z-index:50;background:#10131c";f.title="Embedded tool";f.srcdoc=document.getElementById(id).textContent.replace(/<\\\/script>/g,"<"+"/script>");document.body.appendChild(f);window.cricketFrame=f};
 document.getElementById("ck").onclick=()=>openEmbed("cricket-src");
 document.getElementById("lb").onclick=()=>openEmbed("lab-src");
 document.getElementById("tpr").onclick=practiceHome;document.getElementById("tsr").onclick=searchView;document.getElementById("tsv").onclick=saved;document.getElementById("tst").onclick=settings;
 const ib=document.getElementById("inst");ib.onclick=()=>{if(dp){dp.prompt();dp=null;ib.hidden=true}};
 scrollTo(0,0)}
function chap(c){
 cur=c;const n=c.sec.filter((s,i)=>S.read[rk(i)]).length,b=S.best[c.n];
 app.innerHTML=`<button class="back" id="bk">‹ All chapters</button><h1>Chapter ${c.n}</h1><p class="sub">${c.title}</p>
 <div class="bar"><i style="width:${n/c.sec.length*100}%"></i></div><p class="sub">${n} of ${c.sec.length} sections read${b!=null?" · best test score "+b+"/20":""}</p>`+
 c.sec.map((s,i)=>`<button class="row" data-s="${i}"><span class="dot ${S.read[rk(i)]?"ok":""}">${S.read[rk(i)]?"✓":""}</span><span><span class="tt">${s[0]}${S.bm[rk(i)]?" ★":""}${S.notes[rk(i)]?" ✎":""}</span><small>${s[1]}</small></span></button>`).join("")+
 `<button class="row" id="pr"><span class="dot"></span><span><span class="tt">Practice problems</span><small>${c.pr.length} worked examples${c.pb.length?" + "+c.pb.length+" challenge problems":""}</small></span></button>
 <button class="row" id="ts"><span class="dot ${b!=null?"ok":""}">${b!=null?"✓":""}</span><span><span class="tt">Chapter test</span><small>20 marks: quiz 40% and subjective 60%</small></span></button>`;
 document.getElementById("bk").onclick=home;
 app.querySelectorAll("[data-s]").forEach(x=>x.onclick=()=>sec(+x.dataset.s));
 document.getElementById("pr").onclick=prac;document.getElementById("ts").onclick=test;scrollTo(0,0)}
function sec(i){
 const s=cur.sec[i],k=rk(i);
 app.innerHTML=`<button class="back" id="bk">‹ Chapter ${cur.n}</button><h2>${s[0]}</h2>${s[2]}
 <h3>My note</h3><textarea id="nt" rows="4" placeholder="Write your own note for this section…">${esc(S.notes[k]||"")}</textarea>
 <button class="btn" id="mk">${S.read[k]?"Marked as read ✓":"Mark as read"}</button><button class="btn alt" id="bmk">${S.bm[k]?"★ Bookmarked":"☆ Bookmark"}</button>${i<cur.sec.length-1?'<button class="btn alt" id="nx">Next section</button>':""}`;
 $("bk").onclick=()=>chap(cur);
 $("mk").onclick=e=>{S.read[k]=!S.read[k];save();e.target.textContent=S.read[k]?"Marked as read ✓":"Mark as read"};
 $("bmk").onclick=e=>{S.bm[k]=!S.bm[k];if(!S.bm[k])delete S.bm[k];save();e.target.textContent=S.bm[k]?"★ Bookmarked":"☆ Bookmark"};
 $("nt").oninput=e=>{const v=e.target.value;if(v.trim())S.notes[k]=v;else delete S.notes[k];save()};
 const nx=$("nx");if(nx)nx.onclick=()=>sec(i+1);scrollTo(0,0)}
function prac(){
 const tg={Standard:"var(--mute)",Hard:"var(--hi)",Proof:"var(--acc)"};
 app.innerHTML=`<button class="back" id="bk">‹ Chapter ${cur.n}</button><h2>Practice problems</h2><h3>Worked examples</h3><p class="sub">Try on paper first, then open the solution.</p>`+
 cur.pr.map((p,i)=>`<div class="card"><b>${i+1}. ${p[0]}</b><details><summary>Solution</summary><div class="ans">${p[1]}</div></details></div>`).join("")+
 (cur.pb.length?`<h3>Challenge set · ${cur.pb.length} problems</h3><p class="sub">Standard, Hard and Proof problems. Solutions are not included yet.</p>`+
 cur.pb.map((p,i)=>`<div class="card"><span class="tt" style="font-size:12.5px;font-weight:700;color:${tg[p[0]]}">${p[0]}</span><br><b>${i+1}. ${p[1]}</b><br><button class="btn alt" data-ps="${i}" style="padding:7px 12px;font-size:13px;margin:10px 0 0">${S.solved[cur.n+"-"+i]?"✓ Solved":"Mark solved"}</button></div>`).join(""):"");
 document.getElementById("bk").onclick=()=>chap(cur);
 app.querySelectorAll("[data-ps]").forEach(b=>b.onclick=()=>{const k=cur.n+"-"+b.dataset.ps;S.solved[k]=!S.solved[k];if(!S.solved[k])delete S.solved[k];save();b.textContent=S.solved[k]?"✓ Solved":"Mark solved"});scrollTo(0,0)}
function test(){
 const QZ=cur.qz,SB=cur.sb;let q=QZ.map(()=>-1),m=SB.map(()=>-1),fin=false;
 app.innerHTML=`<button class="back" id="bk">‹ Chapter ${cur.n}</button><h2>Chapter ${cur.n} test</h2><p class="sub">20 marks. Part A quiz: 8 marks (40%). Part B subjective: 12 marks (60%).</p><h3>Part A · Quiz (2 marks each)</h3>`+
 QZ.map((x,i)=>`<div class="card"><b>${i+1}. ${x[0]}</b>${x[1].map((o,k)=>`<button class="opt" data-q="${i}" data-k="${k}">${o}</button>`).join("")}</div>`).join("")+
 `<h3>Part B · Subjective (4 marks each)</h3>`+
 SB.map((x,i)=>`<div class="card"><b>${i+1}. ${x[0]}</b><textarea rows="4" placeholder="Write your answer here or on paper"></textarea><details><summary>Model answer</summary><div class="ans">${x[1]}</div></details><div>Marks you award yourself:</div>${[0,1,2,3,4].map(k=>`<button class="mk" data-m="${i}" data-k="${k}">${k}</button>`).join("")}</div>`).join("")+
 `<button class="btn" id="fn">Finish test</button><div id="res"></div>`;
 document.getElementById("bk").onclick=()=>chap(cur);
 app.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>{if(fin)return;const i=+b.dataset.q;q[i]=+b.dataset.k;app.querySelectorAll(`[data-q="${i}"]`).forEach(x=>x.classList.toggle("sel",x===b))});
 app.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{const i=+b.dataset.m;m[i]=+b.dataset.k;app.querySelectorAll(`[data-m="${i}"]`).forEach(x=>x.classList.toggle("sel",x===b))});
 document.getElementById("fn").onclick=()=>{
  fin=true;let a=0;QZ.forEach((x,i)=>{if(q[i]==x[2])a+=2;app.querySelectorAll(`[data-q="${i}"]`).forEach(o=>{if(+o.dataset.k==x[2])o.classList.add("good");else if(o.classList.contains("sel"))o.classList.add("wrong")})});
  const b=m.reduce((s,v)=>s+Math.max(v,0),0),t=a+b;S.best[cur.n]=Math.max(S.best[cur.n]||0,t);save();
  const r=document.getElementById("res");r.innerHTML=`<div class="card"><div class="score">${t} / 20</div><p>Quiz ${a}/8 · Subjective ${b}/12${m.includes(-1)?"<br>Award yourself marks for every subjective answer to complete your score.":""}</p></div>`;r.scrollIntoView({behavior:"smooth"})};
 scrollTo(0,0)}
addEventListener("message",e=>{if(e.data==="cricket-back"&&window.cricketFrame){window.cricketFrame.remove();window.cricketFrame=null}});
applyPref();cover();
</script></body></html>
